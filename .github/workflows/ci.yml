name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smartjisho
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: smartjisho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartjisho -d smartjisho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://smartjisho:local_test_only@127.0.0.1:5432/smartjisho_test
      TEST_DATABASE_URL: postgresql+psycopg://smartjisho:local_test_only@127.0.0.1:5432/smartjisho_test
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Apply database migrations
        run: uv run --locked alembic upgrade head
        
      - name: Run tests
        run: uv run --locked pytest