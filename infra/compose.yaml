services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: smartjisho
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: smartjisho
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartjisho -d smartjisho"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: